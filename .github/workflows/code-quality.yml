name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # VEKTRUN: los 15 ficheros *.test.ts existian desde hacia meses y NINGUN
      # workflow los ejecutaba — no habia script `test` en package.json, y
      # `test:playwright` corre otra cosa. 89 casos escritos, cero ejercitados.
      #
      # Va ANTES de lint y formato a proposito: si algo esta roto de verdad,
      # que se entere por el test y no por una comilla mal puesta.
      - name: Run unit tests
        run: bun test src/

      - name: Check translation consistency
        run: bun run check:translations

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check
